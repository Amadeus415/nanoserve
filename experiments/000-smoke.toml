id = "000-smoke"
title = "Plumbing smoke test (mock engine, no weights)"

question = """
Does the lab loop work end to end — spec -> run -> env capture -> scorecard ->
charts -> status log — on a machine with no model weights?
"""

hypothesis = """
The mock engine emits words at a fixed rate, so decode_tps should be roughly
constant across prompt lengths and close to MockEngine's words_per_second (50).
Any dependence on prompt length here would be a bug in the harness, not physics.
"""

[prediction]
metric = "decode_tps"
x = "prompt_tokens_target"
reasoning = """
MockEngine sleeps 1/50s between tokens and ignores the prompt entirely.
So decode_tps ~= 50 at every context length, minus a little Python overhead.
Predicting 48 flat. If the curve slopes, the harness is measuring itself.
"""

[prediction.values]
16 = 48.0
128 = 48.0
512 = 48.0

[sweep]
engine = "mock"
model = ""
prompt_tokens = [16, 128, 512]
max_tokens = [32]
temperature = 0.7
repeats = 3
warmup = 1
label = "mock"

[control]
notes = "mock engine — numbers are meaningless as performance data, on purpose"
