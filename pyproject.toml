[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoserve"
version = "0.1.0"
description = "A minimal, hackable LLM serving stack for learning inference/serving engineering on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amadeus" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# Apple Silicon inference engine (mlx-lm only installs/builds on macOS arm64)
mac = ["mlx-lm>=0.19"]
viz = ["matplotlib>=3.9"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["nanoserve*"]
